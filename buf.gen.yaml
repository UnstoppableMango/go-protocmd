version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/unstoppablemango/go-protocmd/gen

plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: gen
    opt:
      - paths=source_relative

  - remote: buf.build/grpc/go:v1.6.1
    out: gen
    opt:
      - paths=source_relative

inputs:
  - directory: proto
  - module: buf.build/unmango/apis
    paths:
      - unmango/cli
